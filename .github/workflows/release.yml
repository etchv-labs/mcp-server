name: Release
# Runs when the monorepo export tags this repository v<version>. Registries trust
# this workflow through OIDC (trusted publishing): no publish token is stored.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm test
      - name: Publish to npm with provenance
        run: npm publish
